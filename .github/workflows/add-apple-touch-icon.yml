name: Add apple-touch-icon link
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert apple-touch-icon link into index.html
        run: |
          python3 - <<'PYEOF'
          path = 'index.html'
          with open(path, encoding='utf-8') as f:
              content = f.read()
          tag = '<link rel="apple-touch-icon" href="/apple-touch-icon.png">'
          if tag in content:
              print('Tag already present; nothing to do.')
          else:
              lines = content.split('\n')
              out = []
              inserted = False
              for line in lines:
                  out.append(line)
                  if not inserted and 'rel="icon"' in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      out.append(indent + tag)
                      inserted = True
              with open(path, 'w', encoding='utf-8') as f:
                  f.write('\n'.join(out))
              print('Tag inserted.' if inserted else 'No rel="icon" line found; nothing changed.')
          PYEOF
          grep -n "apple-touch-icon" index.html || true
      - name: Commit and push
        run: |
          git config user.name "perlatherapygames"
          git config user.email "perlatherapygames@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add apple-touch-icon link to index.html"
            git push
          fi
